version: '3.9'
services:
 postgres:
  image: postgres:16
  container_name: sourcing_db
  restart: unless-stopped
  environment:
   POSTGRES_DB: sourcing
   POSTGRES_USER: analyst
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
  ports:
   - '5432:5432'
  volumes:
   - postgres_data:/var/lib/postgresql/data
volumes:
 postgres_data:
